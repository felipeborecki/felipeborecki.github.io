<div class="page-wrap">
  <div class="booking-card">
    <h1>📅 Agendar reunião</h1>
    <p class="sub">Preencha o formulário abaixo com os dados principais. <strong>Responderei em até 24 horas</strong> com um orçamento sem compromisso.</p>

    <form id="appointment-form" action="https://formspree.io/f/mbdokzdj" method="POST">
      
      <div class="form-row">
        <div class="form-group">
          <label for="name">Nome *</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">E-mail *</label>
          <input type="email" id="email" name="email" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="phone">Telefone <span class="optional">(opcional)</span></label>
          <input type="tel" id="phone" name="phone" placeholder="+43 ...">
        </div>
        <div class="form-group">
          <label for="date">Data preferida <span class="optional">(opcional)</span></label>
          <input type="date" id="date" name="date">
        </div>
      </div>

      <div class="form-group">
        <label for="service">Tipo de serviço *</label>
        <select id="service" name="service" required>
          <option value="">Escolher</option>
          <option value="Interpretação judicial">Interpretação judicial</option>
          <option value="Interpretação médica">Interpretação médica</option>
          <option value="Interpretação para autoridades">Interpretação para autoridades</option>
          <option value="Interpretação para particulares">Interpretação para particulares</option>
          <option value="Tradução especializada">Tradução especializada</option>
          <option value="Acompanhamento internacional">Acompanhamento internacional</option>
          <option value="Serviço remoto / telefónico">Serviço remoto / telefónico</option>
          <option value="Outro">Outro</option>
        </select>
      </div>

      <div class="form-group">
        <label for="language">Idioma(s) *</label>
        <select id="language" name="language" required>
          <option value="">Escolher</option>
          <option value="Português ↔ Alemão">Português ↔ Alemão</option>
          <option value="Espanhol ↔ Alemão">Espanhol ↔ Alemão</option>
          <option value="Português ↔ Espanhol">Português ↔ Espanhol</option>
          <option value="Português ↔ Inglês">Português ↔ Inglês</option>
          <option value="Espanhol ↔ Inglês">Espanhol ↔ Inglês</option>
          <option value="Outra combinação">Outra combinação</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">Mensagem *</label>
        <textarea id="message" name="message" placeholder="Descreva brevemente o seu pedido: local, duração estimada, contexto..." required></textarea>
      </div>

      <button type="submit" class="cta" id="submit-btn">Enviar pedido</button>
      <p id="form-status"></p>

    </form>
  </div>
</div>

<footer>

<script>
  document.querySelectorAll('.flags a').forEach(el => {
    el.addEventListener('click', function() {
      const lang = this.getAttribute('href').replace(/\//g, '') || 'de';
      try { localStorage.setItem('preferred-lang', lang); } catch(e) {}
      if (typeof gtag === 'function') {
        gtag('event', 'language_switch', { 'event_category': 'engagement', 'event_label': lang });
      }
    });
  });

  const form = document.getElementById('appointment-form');
  if (form) {
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      const status = document.getElementById('form-status');
      const btn = document.getElementById('submit-btn');
      const original = btn.textContent;

      btn.disabled = true;
      btn.textContent = 'A enviar...';
      status.className = 'sending';
      status.textContent = 'A enviar...';

      try {
        const res = await fetch(form.action, {
          method: form.method,
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        if (!res.ok) throw new Error('Erro ao enviar. Tente novamente.');

        status.className = 'success';
        status.textContent = '✓ Pedido enviado com sucesso! Responderei em até 24 horas.';
        form.reset();

        if (typeof gtag === 'function') {
          gtag('event', 'appointment_submit', { 'event_category': 'contact', 'event_label': 'success' });
        }
      } catch (err) {
        status.className = 'error';
        status.textContent = err.message || 'Erro ao enviar. Tente novamente mais tarde.';
      } finally {
        btn.disabled = false;
        btn.textContent = original;
        setTimeout(() => { 
          if (status.classList.contains('success')) {
            status.className = '';
            status.textContent = '';
          }
        }, 8000);
      }
    });
  }
</script>
