<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Felipe Borecki - Termin buchen</title>
  <meta name="description" content="Buchen Sie einen Termin mit Felipe Borecki. Wählen Sie ein Datum und eine Uhrzeit.">
  <meta name="robots" content="index, follow">
  
  <meta property="og:title" content="Felipe Borecki - Termin buchen">
  <meta property="og:description" content="Buchen Sie einen Termin mit Felipe Borecki.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://felipeborecki.com/appointment.html">
  <meta property="og:locale" content="de_AT">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230e1528'/%3E%3Ctext x='50' y='68' font-family='Arial' font-size='48' font-weight='700' fill='white' text-anchor='middle'%3EFB%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{font-family:'Roboto',sans-serif;line-height:1.6;color:#333;background:#f8f9fa}

    header{background:#0e1528;color:#fff;padding:0.8rem 1.5rem;position:fixed;width:100%;top:0;z-index:1000;box-shadow:0 2px 12px rgba(0,0,0,.12);border-bottom:1px solid rgba(255,255,255,0.08)}
    .header-content{display:flex;justify-content:space-between;align-items:center;max-width:1400px;margin:0 auto;padding:0 1rem;width:100%;flex-wrap:wrap;gap:0.5rem}
    .header-left{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
    .header-left h1{font-size:1.6rem;margin:0;white-space:nowrap}
    .header-left h1 a{color:#fff;text-decoration:none}
    .header-nav{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
    .header-nav a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.85rem;font-weight:500;transition:all .25s ease;position:relative;padding-bottom:2px;white-space:nowrap}
    .header-nav a::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:2px;background:#fff;transition:width .3s ease}
    .header-nav a:hover{color:#fff}
    .header-nav a:hover::after{width:100%}
    .header-nav a.active{color:#fff}
    .header-nav a.active::after{width:100%}
    .header-right{display:flex;align-items:center;gap:0.8rem}
    .flags{display:flex;gap:.3rem}
    .flags button{width:32px;height:32px;border:none;background:rgba(255,255,255,.12);border-radius:50%;cursor:pointer;transition:all .25s ease;font-size:1.1rem;line-height:1;display:flex;align-items:center;justify-content:center}
    .flags button:hover{background:rgba(255,255,255,.25);transform:scale(1.05)}
    .flags button.active{outline:2px solid rgba(255,255,255,.9);outline-offset:2px;background:rgba(255,255,255,.25)}
    .back-link{color:rgba(255,255,255,0.7);text-decoration:none;font-size:0.8rem;display:flex;align-items:center;gap:4px;transition:color .25s ease}
    .back-link:hover{color:#fff}

    .page-wrap{max-width:700px;margin:100px auto 40px;padding:0 1.5rem}
    .booking-card{background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:2rem;text-align:center}
    .booking-card h1{font-size:1.6rem;color:#0e1528;margin-bottom:0.3rem;font-weight:500}
    .booking-card .sub{color:#888;font-size:0.95rem;margin-bottom:1.5rem}
    .booking-card iframe{max-width:100%;border:none;border-radius:6px;background:#fff;display:block;margin:0 auto}

    footer{background:#0e1528;color:#fff;text-align:center;padding:1.5rem;font-size:0.9rem}
    footer a{color:#fff;text-decoration:underline}
    footer a:hover{color:#ddd}

    @media (max-width:768px){
      header{padding:0.5rem 0.8rem}
      .header-content{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:0.3rem;padding:0 0.3rem}
      .header-left{width:100%;justify-content:center;flex-wrap:wrap;gap:0.4rem}
      .header-left h1{font-size:1.1rem}
      .header-nav{gap:0.4rem;justify-content:center;width:100%}
      .header-nav a{font-size:0.65rem;padding-bottom:1px}
      .header-right{width:100%;justify-content:center;gap:0.3rem}
      .flags button{width:26px;height:26px;font-size:0.85rem}
      .back-link{font-size:0.65rem}
      .page-wrap{margin:85px auto 20px;padding:0 0.8rem}
      .booking-card{padding:1.2rem}
      .booking-card h1{font-size:1.3rem}
      .booking-card .sub{font-size:0.85rem}
      .booking-card iframe{height:420px !important}
    }

    @media (max-width:400px){
      .page-wrap{margin:80px auto 15px}
      .booking-card{padding:0.8rem}
      .booking-card h1{font-size:1.1rem}
      .booking-card iframe{height:380px !important}
    }
  </style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="header-left">
      <h1><a href="/#de" data-lang="name">Felipe Borecki</a></h1>
      <nav class="header-nav">
        <a href="/#services" data-lang="nav-services">Leistungen</a>
        <a href="/#about" data-lang="nav-about">Profil</a>
        <a href="/appointment.html" class="active" data-lang="nav-book">Termin buchen</a>
        <a href="/#contact" data-lang="nav-contact">Kontakt</a>
        <a href="/agb" data-lang="nav-agb">AGB</a>
      </nav>
    </div>
    <div class="header-right">
      <a href="/" class="back-link" data-lang="back-home">← Zurück</a>
      <div class="flags">
        <button class="active" type="button" onclick="setLang('de')" title="Deutsch">🇩🇪</button>
        <button type="button" onclick="setLang('es')" title="Español">🇪🇸</button>
        <button type="button" onclick="setLang('pt')" title="Português">🇧🇷</button>
        <button type="button" onclick="setLang('en')" title="English">🇬🇧</button>
      </div>
    </div>
  </div>
</header>

<div class="page-wrap">
  <div class="booking-card">
    <h1 data-lang="title">📅 Termin buchen</h1>
    <p class="sub" data-lang="sub">Wählen Sie Datum, Uhrzeit und Dauer</p>
    
    <iframe 
      src="https://calendar.zoho.eu/eventreqForm/zz08011230b9e2d616c045e5b4f294cd5fa24d3706e7026723eff3f04489af41322699b4573acd69eb413ccd3ee637b1c006f86c4e?theme=1&l=en&tz=Europe/Vienna"
      title="Programar cita"
      frameborder="0"
      scrolling="no"
      marginwidth="0"
      border="0px"
      marginheight="0"
      height="450px"
      width="100%"
      allowtransparency="true"
      align="center"
      style="max-width:432px;"
    ></iframe>
  </div>
</div>

<footer>
  <p>&copy; 2026 Felipe Borecki. Alle Rechte vorbehalten. | <a href="/agb">AGB / Datenschutz</a></p>
</footer>

<script>
  const translations = {
    de: {
      name: 'Felipe Borecki',
      'nav-services': 'Leistungen',
      'nav-about': 'Profil',
      'nav-book': 'Termin buchen',
      'nav-contact': 'Kontakt',
      'nav-agb': 'AGB',
      'back-home': '← Zurück',
      title: '📅 Termin buchen',
      sub: 'Wählen Sie Datum, Uhrzeit und Dauer'
    },
    es: {
      name: 'Felipe Borecki',
      'nav-services': 'Servicios',
      'nav-about': 'Perfil',
      'nav-book': 'Reservar cita',
      'nav-contact': 'Contacto',
      'nav-agb': 'Términos',
      'back-home': '← Volver',
      title: '📅 Reservar cita',
      sub: 'Elija fecha, hora y duración'
    },
    pt: {
      name: 'Felipe Borecki',
      'nav-services': 'Serviços',
      'nav-about': 'Perfil',
      'nav-book': 'Agendar reunião',
      'nav-contact': 'Contato',
      'nav-agb': 'Termos',
      'back-home': '← Voltar',
      title: '📅 Agendar reunião',
      sub: 'Escolha data, horário e duração'
    },
    en: {
      name: 'Felipe Borecki',
      'nav-services': 'Services',
      'nav-about': 'Profile',
      'nav-book': 'Book appointment',
      'nav-contact': 'Contact',
      'nav-agb': 'Terms',
      'back-home': '← Back',
      title: '📅 Book appointment',
      sub: 'Choose date, time and duration'
    }
  };

  let currentLang = 'de';

  function safeGetStoredLang() {
    try { return localStorage.getItem('lang') || 'de'; }
    catch (e) { return 'de'; }
  }

  function safeSetStoredLang(lang) {
    try { localStorage.setItem('lang', lang); }
    catch (e) {}
  }

  function setLang(lang) {
    const t = translations[lang] || translations.de;
    currentLang = lang;
    document.documentElement.lang = lang;
    safeSetStoredLang(lang);

    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', '/appointment.html#' + lang);
    }

    document.querySelectorAll('.flags button').forEach(btn => btn.classList.remove('active'));
    const activeBtn = document.querySelector(`.flags button[onclick*="'${lang}'"]`);
    if (activeBtn) activeBtn.classList.add('active');

    document.querySelectorAll('[data-lang]').forEach(el => {
      const key = el.dataset.lang;
      if (t[key] !== undefined) el.textContent = t[key];
    });
  }

  document.addEventListener('DOMContentLoaded', function() {
    const hash = window.location.hash.replace('#', '');
    const savedLang = safeGetStoredLang();
    const detectedLang = translations[hash] ? hash : savedLang;
    setLang(detectedLang);
  });
</script>

</body>
</html>
